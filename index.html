<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DotMuncher 95</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #008080;
        color: #000;
        font-family: monospace;
        font-size: 13px;
        -webkit-font-smoothing: none;
      }
      .desktop {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 12px;
      }
      .window {
        background: #c0c0c0;
        padding: 3px;
        border: 2px solid;
        border-color: #dfdfdf #000 #000 #dfdfdf;
        box-shadow:
          inset 1px 1px #fff,
          inset -1px -1px #808080;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 4px;
        background: linear-gradient(90deg, #000080, #1084d0);
        color: #fff;
        font-weight: bold;
      }
      .titlebar .icon {
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        background: #2a4bd7;
        border: 1px solid #fff;
        position: relative;
      }
      .titlebar .icon::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 1px;
        width: 6px;
        height: 4px;
        background: #c4c4c4;
      }
      .titlebar .icon::after {
        content: "";
        position: absolute;
        left: 2px;
        bottom: 1px;
        width: 8px;
        height: 4px;
        background: #f4f4f4;
      }
      .titlebar .title {
        flex: 1;
        letter-spacing: 0.5px;
      }
      .titlebar .buttons {
        display: flex;
        gap: 2px;
      }
      .titlebar .buttons span {
        display: inline-block;
        width: 16px;
        height: 14px;
        box-sizing: border-box;
        background: #c0c0c0;
        color: #000;
        border: 1px solid;
        border-color: #fff #000 #000 #fff;
        box-shadow: inset -1px -1px #808080;
        font-size: 10px;
        font-weight: bold;
        line-height: 11px;
        text-align: center;
        user-select: none;
      }
      .menubar {
        display: flex;
        gap: 14px;
        padding: 3px 6px 2px;
        user-select: none;
      }
      .menubar span::first-letter {
        text-decoration: underline;
      }
      .screen {
        background: #000;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        line-height: 0;
      }
      .screen canvas {
        display: block;
        max-width: 100%;
        image-rendering: pixelated;
      }
      .statusbar {
        display: flex;
        gap: 3px;
        margin-top: 3px;
      }
      .statusbar .panel {
        flex: 1;
        padding: 2px 5px;
        border: 1px solid;
        border-color: #808080 #fff #fff #808080;
        white-space: nowrap;
      }
      .taskbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        background: #c0c0c0;
        border-top: 2px solid #fff;
        user-select: none;
      }
      .taskbar .start {
        padding: 2px 8px;
        font-weight: bold;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #000 #000 #fff;
      }
      .taskbar .task {
        padding: 2px 8px;
        background: #dfdfdf;
        border: 2px solid;
        border-color: #000 #fff #fff #000;
      }
      .taskbar .clock {
        margin-left: auto;
        padding: 2px 8px;
        border: 1px solid;
        border-color: #808080 #fff #fff #808080;
      }
    </style>
  </head>
  <body>
    <div class="desktop">
      <div class="window" role="application" aria-label="DotMuncher 95">
        <div class="titlebar">
          <span class="icon" aria-hidden="true"></span>
          <span class="title">DotMuncher 95</span>
          <span class="buttons" aria-hidden="true"><span>_</span><span>&#9633;</span><span>&times;</span></span>
        </div>
        <div class="menubar" aria-hidden="true"><span>Game</span><span>Options</span><span>Help</span></div>
        <div class="screen" id="screen"></div>
        <div class="statusbar">
          <span class="panel">Arrows / WASD: move</span>
          <span class="panel">Enter: start</span>
          <span class="panel">P: pause</span>
        </div>
      </div>
    </div>
    <div class="taskbar" aria-hidden="true">
      <span class="start">Start</span>
      <span class="task">DotMuncher 95</span>
      <span class="clock">11:59 PM</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
